name: Schema regeneration consistency

# schema_types.py/schema_types.ts (both headed "Generated by quicktype. Do
# not manually modify this file.") are built from the JSON Schema sources
# under schemas/schemas/ by `cd schemas && npm run build`. Nothing enforces
# that the two stay in sync: a field can be added straight to the generated
# output (or drift in by hand) without ever reaching the schema it claims to
# come from, and the next real regeneration silently deletes it - see
# docs/troubleshooting.md's "A quicktype-generated frontend type is
# 'missing' a field" entry for the recurring incident this produces.
#
# This job runs the real generator, formats its output with the same
# black/isort/prettier versions pre-commit already pins for these two
# files, and diffs the result against what's committed - mirroring
# docs-lint.yml's readme-parity job for a different generated artifact.
# Raw quicktype output is never itself formatted (docs/troubleshooting.md),
# so skipping the format step here would fail on every PR regardless of
# schema content, teaching people to ignore the check.

on:
  pull_request:
    paths:
      - "schemas/**"
      - "MPCAutofill/cardpicker/schema_types.py"
      - "frontend/src/common/schema_types.ts"
      - ".github/workflows/schema-regeneration-consistency.yml"
  push:
    branches: ["master"]
    paths:
      - "schemas/**"
      - "MPCAutofill/cardpicker/schema_types.py"
      - "frontend/src/common/schema_types.ts"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-regeneration-consistency:
    name: Regenerated types match the committed files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.15
          cache: "npm"
          cache-dependency-path: schemas/package-lock.json
      - uses: actions/setup-python@v6
        with:
          python-version: 3.13
      - name: Install schema generator dependencies
        working-directory: schemas
        run: npm ci
      - name: Install pre-commit
        run: pip install pre-commit
      - name: Snapshot the committed generated files
        run: |
          mkdir -p /tmp/schema-consistency-committed
          cp MPCAutofill/cardpicker/schema_types.py /tmp/schema-consistency-committed/schema_types.py
          cp frontend/src/common/schema_types.ts /tmp/schema-consistency-committed/schema_types.ts
      - name: Regenerate schema types
        working-directory: schemas
        run: npx tsx ./quicktype.ts
      - name: Format the regenerated output
        # Same hooks pre-commit runs on these files (test-pre-commit.yml),
        # invoked directly rather than via `pre-commit run --all-files` so
        # this job only pays for the two files it actually touched.
        run: |
          pre-commit run black --files MPCAutofill/cardpicker/schema_types.py || true
          pre-commit run isort --files MPCAutofill/cardpicker/schema_types.py || true
          pre-commit run prettier --files frontend/src/common/schema_types.ts || true
      - name: Diff regenerated output against the committed files
        run: |
          status=0
          if ! diff -u /tmp/schema-consistency-committed/schema_types.py MPCAutofill/cardpicker/schema_types.py; then
            echo "::error file=MPCAutofill/cardpicker/schema_types.py::schema_types.py is out of sync with schemas/schemas/ - edit the JSON Schema source, then run \`cd schemas && npm run build\` and format the output (see docs/troubleshooting.md)"
            status=1
          fi
          if ! diff -u /tmp/schema-consistency-committed/schema_types.ts frontend/src/common/schema_types.ts; then
            echo "::error file=frontend/src/common/schema_types.ts::schema_types.ts is out of sync with schemas/schemas/ - edit the JSON Schema source, then run \`cd schemas && npm run build\` and format the output (see docs/troubleshooting.md)"
            status=1
          fi
          exit $status
