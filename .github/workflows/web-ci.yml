name: Web CI

# Full-matrix CI on every push to master (issue #773).
#
# Surface-scoped runs (added 2026-07-25, PR #466) gated this workflow's
# jobs on a `git diff --name-only` of the push's own commit range, so a
# merge whose own diff touched only one surface skipped the other
# surface's jobs. That is unsound for a deploy: a deploy cut at that
# merge ships its PARENT's changes too, and the parent's surface work
# then has no CI at the deployed SHA while every check reports green.
# Observed: 29b29601 (backend-only merge of #772) ran the frontend jobs
# as SKIPPED while its parent fec94ee6 (#770) had just rewritten
# frontend/src/features/questionFeed/QuestionFeed.tsx.
#
# The runbook's "CI green at the exact SHA" is only readable truthfully
# as "every surface got CI at the deployed SHA", so the full matrix runs
# unconditionally here: no surface detection, no per-surface gates, no
# push-time path filter (a filtered push would again ship an ancestor's
# surface change with zero checks at the merge SHA). The workflow-level
# path scoping that remains lives in the PR-triggered workflows
# (test-frontend.yml), where the PR head IS the whole change being
# merged and scoping is exact.
on:
  push:
    branches: ["master"]
  workflow_dispatch:
jobs:
  test-backend:
    name: Backend tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres
        env:
          POSTGRES_USER: mpcautofill
          POSTGRES_PASSWORD: mpcautofill
          POSTGRES_DB: mpcautofill
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-backend
        with:
          google-drive-api-key: ${{ secrets.GOOGLE_DRIVE_API_KEY }}
          moxfield-secret: ${{ secrets.MOXFIELD_SECRET }}
  test-frontend:
    name: Frontend tests (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    runs-on: ubuntu-latest
    # Playwright's browsers + OS deps are pre-baked into this image (matching
    # frontend/package-lock.json's pinned @playwright/test version), so the
    # composite action below no longer needs to `playwright install`/
    # `install-deps` - that apt work was the dominant cost of this job.
    container:
      image: mcr.microsoft.com/playwright:v1.57.0-noble
      options: --user 1001
    env:
      NEXT_TELEMETRY_DISABLED: 1
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-frontend
        with:
          shard_index: ${{ matrix.shardIndex }}
          shard_total: ${{ matrix.shardTotal }}
  test-build-and-jest:
    name: Frontend build & Jest tests
    runs-on: ubuntu-latest
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/test-frontend
        with:
          run_build_and_jest: "true"
          run_playwright: "false"
  merge-frontend-test-reports:
    name: Merge Playwright reports
    # !cancelled() (not success()) so this still runs - and reports what
    # passed/failed - even if one or more shards failed.
    if: ${{ !cancelled() }}
    needs: [test-frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.15
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Download blob reports
        uses: actions/download-artifact@v8
        with:
          path: frontend/all-blob-reports
          pattern: blob-report-*
          merge-multiple: true
      - name: Merge reports
        working-directory: frontend
        run: npx playwright merge-reports --reporter html ./all-blob-reports
      - name: Upload HTML report
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 30
  build-frontend:
    name: Build frontend
    # Formatting/static-type-checking used to be duplicated here via a
    # test-pre-commit job (removed 2026-07-25) - test-pre-commit.yml
    # already runs `pre-commit run --all-files` unconditionally on every
    # push to master, so the copy here could never actually deduplicate:
    # even path-scoping it would still leave test-pre-commit.yml running
    # the identical check on the same push. Removed rather than scoped;
    # the standalone workflow's own status check on the commit still
    # covers formatting, this job no longer waits on it.
    needs: [test-frontend, test-build-and-jest]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/build-frontend
        with:
          image-bucket-url: ${{ secrets.IMAGE_CDN_BUCKET_DOMAIN }}
          image-worker-url: ${{ secrets.IMAGE_CDN_WORKER_DOMAIN }}
          google-drive-client-id: ${{ secrets.NEXT_PUBLIC_GOOGLE_DRIVE_CLIENT_ID }}
          google-drive-app-id: ${{ secrets.NEXT_PUBLIC_GOOGLE_DRIVE_APP_ID }}
