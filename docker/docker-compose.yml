# This docker compose file spins up the database services required by the MPC Autofill backend.
# It's separated from the docker compose file which spins up the backend itself to enable
# local development through a Python virtual environment running natively on the dev machine.

services:
  # Postgres database for Django
  postgres:
    image: postgres:15.0-alpine
    container_name: mpcautofill_postgres
    # client_connection_check_interval (Postgres 14+): probes the client socket
    # periodically DURING query execution and aborts the query if the client is
    # gone, rather than computing to completion for a dead client (issue #462).
    # Deliberately NOT statement_timeout - BULK-mode eligibility scans legitimately
    # run for minutes-hours with a live client and must not be killed.
    command: postgres -c client_connection_check_interval=30000
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_DB=mpcautofill
      - POSTGRES_USER=mpcautofill
      - POSTGRES_PASSWORD=mpcautofill
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Elasticsearch used by MPCAutofill
  elasticsearch:
    image: elasticsearch:7.14.1
    container_name: mpcautofill_elasticsearch
    ports:
      - "127.0.0.1:9200:9200"
    environment:
      - discovery.type=single-node
      - logger.level=WARN
      - "ES_JAVA_OPTS=-Xms2048m -Xmx2048m"
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data

# Persistent storage for containers
volumes:
  postgres_data:
  elasticsearch_data:
